<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ve-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="50%" stop-color="#0099ff" />
      <stop offset="100%" stop-color="#0052cc" />
    </linearGradient>
    <linearGradient id="ve-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="ve-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0099ff" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ve-blue)" filter="url(#ve-glow)" />

  <!-- Globe Longitudes & Latitudes -->
  <circle cx="32" cy="32" r="22" stroke="white" stroke-width="2.5" stroke-opacity="0.9" fill="none" />
  <ellipse cx="32" cy="32" rx="10" ry="22" stroke="white" stroke-width="1.8" stroke-opacity="0.65" fill="none" />
  <line x1="10" y1="32" x2="54" y2="32" stroke="white" stroke-width="1.8" stroke-opacity="0.65" />
  <line x1="14" y1="21" x2="50" y2="21" stroke="white" stroke-width="1.4" stroke-opacity="0.5" />
  <line x1="14" y1="43" x2="50" y2="43" stroke="white" stroke-width="1.4" stroke-opacity="0.5" />

  <!-- Dynamic Supersonic Airplane Arc -->
  <path d="M12 46 C20 42, 38 32, 50 16" stroke="url(#ve-gold)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Stylized Jet / Compass Wing at Head of Arc -->
  <path d="M50 16 L44 19 L47 23 Z" fill="url(#ve-gold)" />
  <path d="M50 16 L43 14 L44 18 Z" fill="#f59e0b" />

  <!-- Trust Gold Star -->
  <polygon points="32,9 33.8,14.6 39.7,14.6 34.9,18.1 36.7,23.7 32,20.2 27.3,23.7 29.1,18.1 24.3,14.6 30.2,14.6" fill="url(#ve-gold)" />
</svg>
